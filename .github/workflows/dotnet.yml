name: dotnet-windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: 9.0.x
  RUNTIME_ID: win-x64

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore --use-lock-file

      - name: Build
        run: dotnet build SeraphicSense.csproj -c Release --no-restore

      - name: Publish self-contained win-x64
        run: >
          dotnet publish SeraphicSense.csproj
          -c Release
          -r ${{ env.RUNTIME_ID }}
          --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true
          /p:DebugType=None
          /p:DebugSymbols=false
          -o artifacts/publish/win-x64

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          "app_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Archive portable app
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/publish/win-x64/*" -DestinationPath "artifacts/SeraphicSense-win-x64.zip" -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeraphicSense-win-x64
          path: artifacts/SeraphicSense-win-x64.zip

      - name: Install Inno Setup
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer exe
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found after installation."
          }

          New-Item -ItemType Directory -Path "artifacts/installer" -Force | Out-Null
          $publishDir = (Resolve-Path "artifacts/publish/win-x64").Path
          $outputDir = (Resolve-Path "artifacts/installer").Path
          $issPath = Join-Path $env:RUNNER_TEMP "SeraphicSense.iss"

          $issContent = @(
            '#ifndef AppName'
            '  #define AppName "SeraphicSense"'
            '#endif'
            ''
            '#ifndef AppVersion'
            '  #define AppVersion "1.0.0"'
            '#endif'
            ''
            '#ifndef AppPublisher'
            '  #define AppPublisher "SeraphicSense"'
            '#endif'
            ''
            '#ifndef AppExeName'
            '  #define AppExeName "SeraphicSense.exe"'
            '#endif'
            ''
            '#ifndef PublishDir'
            '  #error "PublishDir must be provided."'
            '#endif'
            ''
            '[Setup]'
            'AppId={{4A0A9B74-D8E4-4DF9-B45C-3A95B9B876C7}'
            'AppName={#AppName}'
            'AppVersion={#AppVersion}'
            'AppPublisher={#AppPublisher}'
            'SetupIconFile={#PublishDir}\assets\app.ico'
            'UninstallDisplayIcon={app}\assets\app.ico'
            'DefaultDirName={autopf}\{#AppName}'
            'DefaultGroupName={#AppName}'
            'DisableProgramGroupPage=yes'
            'ArchitecturesAllowed=x64compatible'
            'ArchitecturesInstallIn64BitMode=x64compatible'
            'Compression=lzma'
            'SolidCompression=yes'
            'WizardStyle=modern'
            'PrivilegesRequired=admin'
            'CloseApplications=yes'
            'RestartApplications=no'
            'OutputDir=.'
            'OutputBaseFilename=SeraphicSense-Setup'
            ''
            '[Tasks]'
            'Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"'
            'Name: "startup"; Description: "Start with Windows for current user"; GroupDescription: "Additional options:"'
            ''
            '[Files]'
            'Source: "{#PublishDir}\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs'
            ''
            '[Dirs]'
            'Name: "{userappdata}\SeraphicSense"'
            'Name: "{userappdata}\SeraphicSense\BackupPaks"'
            ''
            '[Registry]'
            'Root: HKCU; Subkey: "Software\Microsoft\Windows\CurrentVersion\Run"; ValueType: string; ValueName: "{#AppName}"; ValueData: """{app}\{#AppExeName}"" --minimized"; Flags: uninsdeletevalue; Tasks: startup'
            ''
            '[Icons]'
            'Name: "{group}\{#AppName}"; Filename: "{app}\{#AppExeName}"'
            'Name: "{autodesktop}\{#AppName}"; Filename: "{app}\{#AppExeName}"; Tasks: desktopicon'
            ''
            '[Run]'
            'Filename: "{app}\{#AppExeName}"; Description: "Launch {#AppName}"; Flags: nowait postinstall skipifsilent'
          ) -join "`r`n"

          Set-Content -Path $issPath -Value $issContent -Encoding Ascii

          & $iscc `
            "/DPublishDir=$publishDir" `
            "/DAppVersion=${{ steps.version.outputs.app_version }}" `
            "/O$outputDir" `
            "/FSeraphicSense-Setup" `
            "$issPath"

      - name: Upload installer artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SeraphicSense-Setup
          path: artifacts/installer/SeraphicSense-Setup.exe
